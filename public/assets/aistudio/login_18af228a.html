<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - Sistema de Asistencia Escolar</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-image: url('imagen_login.jpg'); /* Asegúrate de tener esta imagen en la ruta correcta */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      background: rgba(255, 255, 255, 0.95); /* Fondo ligeramente traslúcido para legibilidad */
      backdrop-filter: blur(4px);
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      border: 1px solid var(--border, #e2e8f0);
    }
    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-header img {
      width: 70px;
      height: 70px;
      object-fit: contain;
      margin-bottom: 10px;
    }
    .login-header h1 {
      font-size: 1.25rem;
      font-family: 'Cinzel', serif;
      color: var(--primary, #1e3a8a);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQJaEC9lZWlZ-oCP8mZfecwDroVpB2O_hR9Vs8RGTRN0w&s=10" alt="Insignia">
      <h1>Control de Asistencia</h1>
      <p style="font-size: 0.85rem; color: var(--text-muted);">Inicie sesión con su cuenta autorizada</p>
    </div>

    <form id="login-form" autocomplete="off">
      <div class="form-group">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" placeholder="Ingrese su usuario" autocomplete="off" required>
      </div>
      <div class="form-group">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" placeholder="••••••••" autocomplete="new-password" required>
      </div>
      <div id="login-alert" class="alert" style="display:none; margin-bottom: 12px;"></div>
      <button type="submit" class="btn-accent" style="width: 100%;">Ingresar al Sistema</button>
    </form>
  </div>

  <script>
    // Fuerte a madalusan dagiti input fields inton magi-load ti panid
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('usuario').value = '';
      document.getElementById('clave').value = '';
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const usuario = document.getElementById('usuario').value.trim();
      const clave = document.getElementById('clave').value.trim();
      const alertBox = document.getElementById('login-alert');

      try {
        const response = await fetch('login.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario, clave })
        });
        const data = await response.json();

        if (response.ok && data.success) {
          alertBox.style.display = 'block';
          alertBox.style.backgroundColor = 'var(--success-light, #d1fae5)';
          alertBox.style.color = 'var(--success, #065f46)';
          alertBox.textContent = data.message;
          setTimeout(() => {
            window.location.href = 'index.html'; // Redirige correctamente al panel principal
          }, 1000);
        } else {
          throw new Error(data.message || 'Credenciales incorrectas.');
        }
      } catch (error) {
        alertBox.style.display = 'block';
        alertBox.style.backgroundColor = 'var(--danger-light, #fee2e2)';
        alertBox.style.color = 'var(--danger, #991b1b)';
        alertBox.textContent = error.message;
      }
    });
  </script>
</body>
</html>
